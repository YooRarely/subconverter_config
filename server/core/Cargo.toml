[package]
name = "subconverter-core"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.8"
tokio = { version = "1.0", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-webpki-roots", "json", "gzip", "deflate", "brotli"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml_ng = "0.10"
fancy-regex = "0.14"
toml = "0.8"
urlencoding = "2.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
hyper = { version = "1.0", features = ["full"] }
dotenvy = "0.15"
qenv = "0.3"
humansize = "2.1.3"
moka = { version = "0.12", features = ["future"] }
async-trait = "0.1"
anyhow = "1.0"
redis = { version = "1.0.4", features = ["tokio-comp", "connection-manager"] }
once_cell = "1.21"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

